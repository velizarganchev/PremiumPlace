name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PremiumPlace.sln

      - name: Build
        run: dotnet build PremiumPlace.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test PremiumPlace.sln --no-build --configuration Release --verbosity normal

      - name: Vulnerable package audit (informational)
        run: dotnet list PremiumPlace.sln package --vulnerable --include-transitive
        continue-on-error: true

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: premiumplace-angular
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: premiumplace-angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (headless)
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: npm audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
